sla:
  published: true
  url: https://www.flint.com/docs/slas
  uptime_target: 99.9%
  uptime_timeframe: during subscription term
  performance:
    - metric: Flint page load time
      target: "<=3 seconds (p95)"
      timeframe: measured monthly
      note: Continuously monitored; reported as monthly p95.
  downtime_definition: >-
    Any period over five (5) minutes where the Flint service returns 5xx
    responses. Excludes unavailability caused by customer-specific
    configuration logic.
  scheduled_maintenance: >-
    Planned maintenance performed outside business hours (Mon-Fri 9:00am-5:00pm
    Pacific), or communicated in writing at least 14 days ahead for downtime
    exceeding one day / 7 days ahead for downtime under one day.
  incident_response:
    - severity: Sev1
      definition: Complete service outage affecting all customers (5xx for >5 minutes; pages inaccessible).
      initial_response: "<1 hour"
      resolution: "<12 hours"
    - severity: Sev2
      definition: Major functionality impaired or significantly degraded performance.
      initial_response: "<4 hours"
      resolution: "<24 hours"
  support_hours: 9:00 AM - 5:00 PM Pacific, Monday-Friday, excluding U.S. federal holidays
  emergency_support: 24/7 monitoring and response for Sev1 and Sev2
  service_credits:
    offered: true
    cap: 10% of monthly fees
    issued_within_days: 90
    form: reduction in fees owed, applied monthly
    note: >-
      Credits are explicitly NOT the customer's sole and exclusive remedy, and
      are not construed as a penalty or liquidated damages.
  scope_note: >-
    The SLA is written against "the Flint Service" and Flint page availability.
    It does not carve out or separately commit to the Agent Tasks API or the
    hosted MCP endpoint.
