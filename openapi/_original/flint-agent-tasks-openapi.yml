info:
  title: Flint Agent Tasks API
  version: v1
  description: >-
    Flint's Agent Tasks API lets you run background AI agents against a Flint
    site to modify pages from a free-form prompt, or generate multiple pages
    from a template. Tasks run asynchronously; poll the task or supply a
    callbackUrl webhook to receive completion. Landing pages are generated
    on-brand and can be optionally published.
