    description: Start and monitor background AI agent tasks on a Flint site.
paths:
  /agent/tasks:
    post:
      operationId: createAgentTask
      summary: Create an agent task
      description: >-
        Start a background AI agent on a Flint site. Two task types are
        supported: a free-form `prompt` task that instructs the agent to modify
        the site, and a `generate_pages` task that creates multiple pages from a
        template page and a list of items. Returns a taskId to poll or a
        callbackUrl is invoked on completion.
      tags: [Agent Tasks]
