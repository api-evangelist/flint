format: http-status
envelope_shape: '{"error": "<human-readable message>"}'
note: >-
  Flint's Agent Tasks API documents plain HTTP status codes with a single-key
  JSON body, not RFC 9457 application/problem+json. There is no machine-readable
  error CODE — only an English `error` string — so clients must branch on the
  HTTP status, and the exact published strings below are the only stable
  discriminator within a status. Failed asynchronous tasks surface an
  `errorMessage` string on the task-status response envelope rather than an
  HTTP error, so a 200 can still mean the work failed.
envelope:
  sync_failure_field: error
  async_failure_field: errorMessage
  async_failure_operation: openapi/flint-agent-tasks-api-openapi.yml#getAgentTask
  async_gotcha: >-
    getAgentTask returns HTTP 200 with status "failed" and an errorMessage when
    the agent run fails. Never treat 2xx as success without reading `status`.
