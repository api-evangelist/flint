credit_costs:
  disclaimer: >-
    Published as estimated ranges from real usage, not fixed pricing
    (Flint's own wording on the pricing page).
  items:
    - task: Quick edit (reword, restyle, or fix in one message)
      credits: ~2-10
    - task: Images (generate, swap, or place)
      credits: ~1-6
    - task: Page duplication
      credits: ~0-5
    - task: Components & sections (multi-prompt adjustment or full rework)
      credits: ~20-60
    - task: Simple page (mostly static, a few sections)
      credits: ~60-130
    - task: Average page (form + 1-2 interactive components)
      credits: ~105-195
    - task: Complex page (more than 2 complex components)
      credits: ~135-250
    - task: Comparison page (research + matrix, typical 5 competitors)
      credits: ~80-140
    - task: ABM microsite (~20 variants, researched)
      credits: ~85-115
    - task: Google Ads Agent — a run of recommendations
      credits: ~100-250
    - task: Google Ads Agent — refine a recommendation in chat
      credits: 0 (free)
    - task: Google Ads Agent — implement a recommendation to Google Ads
      credits: 0 (free)
api_metering:
  separate_api_pricing: false
  detail: >-
    "API and MCP-driven page creation" is listed as a Free-plan feature and is
    metered in credits like any other page operation. Enterprise adds
    "CSV bulk upload and API access" as a named tier capability. No per-request
    price, no API-specific quota and no overage rate are published.
plan_changes:
  upgrade: prorated for the remainder of the billing cycle
  downgrade: takes effect at the start of the next billing cycle
  exhaustion: >-
    Buy credit reload bundles on demand (paid plans), upgrade a tier, or switch
    to annual billing for a larger credit pool.
