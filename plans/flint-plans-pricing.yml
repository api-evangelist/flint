note: >-
  Flint prices on a CREDIT unit, not on API calls. Credits are consumed by page
  builds, edits, image generation and Google Ads Agent recommendation runs; API
  and MCP-driven page creation draw from the same credit pool as the UI, so the
  API has no separate meter or price list. Published credit ranges per task are
  captured under `credit_costs` below — Flint states they are estimates from
  real usage, not fixed pricing.
