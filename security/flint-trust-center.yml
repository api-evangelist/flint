compliance_programs:
- name: GDPR
  status: published
  url: https://www.flint.com/docs/data-residency-gdpr
  detail: >-
    Flint publishes a Data Residency & GDPR Compliance page describing what it
    processes and how to configure a compliant deployment: it stores page
    content (HTML/CSS/images) but not visitor data by default; visitor
    interactions are handled by the customer's own analytics/CRM/form tools
    under their policies; Flint-side data collection can be disabled entirely on
    request; and the recommended GDPR posture is reverse-proxy (subfolder)
    hosting so cookies stay first-party under the customer's own CMP.
- name: Data Processing Agreement (DPA)
  status: available-on-request
  contact: privacy@tryflint.com
- name: Regulated-industry review
  status: available-on-request
  contact: support@tryflint.com
  detail: >-
    Flint offers to walk compliance teams through data flows, subprocessors and
    infrastructure certifications for healthcare, finance and other regulated
    sectors — on request, not published.
