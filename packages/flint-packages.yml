      last push date to main (2026-03-26). CHANGELOG.md documents only 1.0.0
      (2026-03-24), so the 1.1.0 bump is undocumented.
    contains:
      - "Flint MCP server config (.mcp.json -> https://mcp.tryflint.com/mcp, transport http)"
      - "edit-site agent skill (skills/edit-site/SKILL.md)"
      - "OAuth authentication flow to the Flint account"
    tools:
      - list_sites
      - run_background_agent
