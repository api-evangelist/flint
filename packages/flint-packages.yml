note: >-
  Flint publishes NO traditional client SDK. Searches of npm, PyPI, RubyGems,
  crates.io, Packagist, NuGet, Maven Central and pkg.go.dev returned no
  first-party Flint (Flint Technologies, Inc. / tryflint.com) client library —
  the npm packages named "flint", "flint-js", "flint-chart" and "@flint.fyi/*"
  belong to unrelated projects and are NOT this company. The only first-party
  distributable Flint ships is a Claude Code plugin published from its own
  GitHub organization (github.com/tryflint), which bundles the hosted MCP
  server config plus an agent skill. Flint's documented integration path for
  everything else is the raw REST API or the hosted MCP endpoint.
packages:
