aid: flint
name: Flint
description: >-
  Flint (Flint Technologies Inc., tryflint.com / flint.com) is an AI web
  platform for marketing teams that programmatically generates on-brand,
  high-converting landing pages and runs autonomous agents — including a Google
  Ad agent — to keep ad accounts optimized. Its products are Pages
  (AI-generated landing pages), Agents (autonomous campaign upkeep), and an
  Agent Tasks REST API plus a hosted MCP server that let developers create,
  modify, and publish pages from Claude, Clay, Relay.app, or any HTTP client.
  Backed by Accel. This profile was enriched from Flint's public developer
  documentation, MCP OAuth discovery metadata, and security surface.
